<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella AI</title>
    <style>
        :root {
            --bg: #0e0e0e;
            --sidebar: #131314;
            --hover: #1e1f20;
            --text-main: #e3e3e3;
            --text-gray: #c4c7c5;
            --accent: #4285f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', Segoe UI, sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar & Mobile Menu --- */
        .sidebar { 
            width: 280px; background: var(--sidebar); display: flex; flex-direction: column; 
            padding: 16px; transition: transform 0.3s ease; z-index: 1000;
        }

        .nav-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 25px; cursor: pointer; font-size: 14px; transition: 0.2s; 
        }
        .nav-item:hover { background: var(--hover); }

        /* --- Main Chat Stage --- */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        
        .header { 
            padding: 12px 20px; display: flex; align-items: center; 
            justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 10;
        }

        .menu-toggle { font-size: 24px; cursor: pointer; padding: 8px; display: none; }

        #chat { 
            flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; 
            flex-direction: column; gap: 30px; scroll-behavior: smooth;
        }

        /* --- Gemini Style Input Bar --- */
        .input-container { 
            padding: 20px 15%; background: linear-gradient(transparent, var(--bg) 30%);
            position: absolute; bottom: 0; width: 100%;
        }

        .pill {
            background: #1e1f20; border-radius: 32px; display: flex; align-items: center; 
            padding: 8px 16px; gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .tool-btn { 
            font-size: 22px; color: var(--text-gray); cursor: pointer; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: 0.2s;
        }
        .tool-btn:hover { background: #333; color: white; }

        input { 
            flex: 1; background: transparent; border: none; color: white; 
            outline: none; padding: 12px 4px; font-size: 16px; 
        }

        .send-arrow { 
            color: var(--accent); font-size: 24px; cursor: pointer; 
            padding: 8px; transition: 0.3s;
        }
        .send-arrow:hover { transform: translateX(3px) scale(1.1); }

        /* --- Message Bubbles --- */
        .msg-row { display: flex; gap: 16px; animation: fadeInUp 0.4s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .content { line-height: 1.6; font-size: 16px; word-wrap: break-word; }
        .b-icon { color: var(--accent); font-weight: bold; font-size: 18px; }

        /* --- Responsive Rules --- */
        @media (max-width: 800px) {
            .sidebar { position: fixed; height: 100%; left: -280px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .menu-toggle { display: block; }
            #chat { padding: 20px 5% 120px 5%; }
            .input-container { padding: 15px 10px; }
            .pill { padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="nav-item" onclick="location.reload()" style="background: #28292a; margin-bottom: 20px;">
            <span>+</span> New Chat
        </div>
        <div style="font-size: 12px; color: var(--text-gray); margin: 10px;">Recent</div>
        <div id="history">
            <div class="nav-item">Frontend vs Backend AI</div>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div class="menu-toggle" onclick="toggleMenu()">☰</div>
            <div style="font-size: 18px; font-weight: 500;">Bella 2.5</div>
            <div style="width: 40px;"></div> </div>

        <div id="chat">
            <div style="margin-top: 15vh; text-align: left;" id="welcome">
                <h1 style="font-size: 48px; font-weight: 500; background: linear-gradient(to right, #4285f4, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Hello, User</h1>
                <h2 style="font-size: 48px; color: #444746;">How can I help?</h2>
            </div>
        </div>

        <div class="input-container">
            <div class="pill">
                <label for="file-up" class="tool-btn">+</label>
                <input type="file" id="file-up" hidden>
                
                <input type="text" id="userInput" placeholder="Message Bella..." onkeypress="if(event.key==='Enter') askBella()">
                
                <div class="send-arrow" onclick="askBella()">➤</div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function askBella() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const msg = input.value;
            if (!msg) return;

            if (document.getElementById('welcome')) document.getElementById('welcome').remove();

            // User Message
            chat.innerHTML += `<div class="msg-row"><div class="content"><b>You</b><br>${msg}</div></div>`;
            
            // Thinking Star (Gemini 2.5 Style)
            const thinkId = "think-" + Date.now();
            chat.innerHTML += `
                <div class="msg-row" id="${thinkId}">
                    <div class="b-icon">✦</div>
                    <div class="content">Generating...</div>
                </div>`;
            
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                
                document.getElementById(thinkId).remove();
                chat.innerHTML += `
                    <div class="msg-row">
                        <div class="b-icon">✦</div>
                        <div class="content">${data.reply}</div>
                    </div>`;
            } catch {
                document.getElementById(thinkId).innerHTML = "The brain is offline.";
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
