<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella AI</title>
    <style>
        :root {
            --bg: #0e0e0e;
            --sidebar: #131314;
            --hover: #1e1f20;
            --text-main: #e3e3e3;
            --text-gray: #c4c7c5;
            --accent: #4285f4;
            --shiny-purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar --- */
        .sidebar { 
            width: 280px; background: var(--sidebar); display: flex; flex-direction: column; 
            padding: 16px; transition: transform 0.3s ease; z-index: 1000;
        }

        /* Search Bar in Sidebar */
        .search-container { margin: 15px 0; padding: 0 10px; }
        .search-bar {
            width: 100%; background: #202123; border: 1px solid #333;
            border-radius: 8px; padding: 8px 12px; color: white; outline: none; font-size: 13px;
        }

        .nav-item { 
            display: flex; align-items: center; gap: 12px; padding: 10px 16px; 
            border-radius: 25px; cursor: pointer; font-size: 14px; color: var(--text-gray);
        }
        .nav-item:hover { background: var(--hover); color: white; }

        /* --- Shiny Bella Header --- */
        .header { padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; }
        
        .bella-logo {
            font-size: 20px; font-weight: 600; letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.8), 0 0 20px rgba(168, 85, 247, 0.4);
            animation: shine 3s infinite alternate;
        }

        @keyframes shine {
            from { opacity: 0.8; text-shadow: 0 0 10px var(--shiny-purple); }
            to { opacity: 1; text-shadow: 0 0 20px var(--shiny-purple), 0 0 30px var(--accent); }
        }

        /* --- Chat Area --- */
        #chat { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 30px; }
        
        .msg-row { display: flex; gap: 16px; animation: fadeInUp 0.4s ease; }
        .b-icon { color: var(--shiny-purple); font-size: 20px; text-shadow: 0 0 8px var(--shiny-purple); }

        /* --- Input --- */
        .input-container { padding: 20px 15%; width: 100%; position: absolute; bottom: 0; background: linear-gradient(transparent, var(--bg)); }
        .pill { background: #1e1f20; border-radius: 32px; display: flex; align-items: center; padding: 8px 20px; gap: 10px; }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 12px; font-size: 16px; }
        .tool-btn { font-size: 24px; color: var(--text-gray); cursor: pointer; }
        .send-arrow { color: var(--accent); font-size: 24px; cursor: pointer; }

        @media (max-width: 800px) {
            .sidebar { position: fixed; left: -280px; height: 100%; }
            .sidebar.open { left: 0; }
            #chat { padding: 20px 5% 120px 5%; }
            .input-container { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="nav-item" onclick="location.reload()" style="background: #28292a; color: white;">+ New Chat</div>
        
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search chats...">
        </div>

        <div style="font-size: 11px; color: #555; margin: 10px 0 5px 15px; text-transform: uppercase;">History</div>
        <div id="history">
            <div class="nav-item">Past Project A</div>
            <div class="nav-item" style="color: var(--accent); font-weight: bold;">Frontend vs Backend AI</div>
            <div class="nav-item">Old Research</div>
        </div>
    </div>

    <div class="main" style="flex:1; display:flex; flex-direction:column;">
        <div class="header">
            <div class="menu-toggle" onclick="toggleMenu()" style="cursor:pointer">☰</div>
            <div class="bella-logo">BELLA 2.5</div>
            <div style="width:20px"></div>
        </div>

        <div id="chat">
            <div style="margin-top: 15vh; text-align: left;" id="welcome">
                <h1 style="font-size: 48px; background: linear-gradient(to right, #4285f4, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Hello, User</h1>
                <h2 style="font-size: 48px; color: #444746;">How can I help?</h2>
            </div>
        </div>

        <div class="input-container">
            <div class="pill">
                <label for="file-up" class="tool-btn">+</label>
                <input type="file" id="file-up" hidden>
                <input type="text" id="userInput" placeholder="Ask Bella anything..." onkeypress="if(event.key==='Enter') askBella()">
                <div class="send-arrow" onclick="askBella()">➤</div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        async function askBella() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const msg = input.value;
            if (!msg) return;
            if (document.getElementById('welcome')) document.getElementById('welcome').remove();
            chat.innerHTML += `<div class="msg-row"><div class="content"><b>You</b><br>${msg}</div></div>`;
            const thinkId = "t-" + Date.now();
            chat.innerHTML += `<div class="msg-row" id="${thinkId}"><div class="b-icon">✦</div><div class="content">Processing...</div></div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
            try {
                const res = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                document.getElementById(thinkId).remove();
                chat.innerHTML += `<div class="msg-row"><div class="b-icon">✦</div><div class="content">${data.reply}</div></div>`;
            } catch { document.getElementById(thinkId).innerHTML = "Offline."; }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
