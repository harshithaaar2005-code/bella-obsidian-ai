<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BELLA // OBSIDIAN</title>
    <style>
        :root {
            --bg: #050505;
            --sidebar: #000000;
            --magic-purple: #7c3aed;
            --text-gray: #71717a;
            --lightning: rgba(139, 92, 246, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e4e4e7; display: flex; height: 100vh; overflow: hidden; }

        /* Lightning Effect */
        .lightning-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999;
            animation: flash 8s infinite;
        }
        @keyframes flash {
            0%, 94%, 100% { background: transparent; }
            95% { background: var(--lightning); }
            96% { background: transparent; }
            97% { background: var(--lightning); }
        }

        /* Sidebar Hierarchy */
        .sidebar { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #111; }
        .nav-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 5px; color: var(--text-gray); transition: 0.3s; }
        .nav-item:hover { background: #0a0a0a; color: white; border: 1px solid #222; }
        .section-label { font-size: 11px; font-weight: bold; color: #3f3f46; margin: 25px 0 10px 10px; text-transform: uppercase; letter-spacing: 1px; }

        /* Main View */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; }
        .model-name { font-size: 14px; letter-spacing: 2px; color: var(--magic-purple); font-weight: bold; }
        
        #chat { flex: 1; overflow-y: auto; padding: 40px 15% 150px 15%; display: flex; flex-direction: column; gap: 35px; }

        /* Message Logic */
        .msg-row { display: flex; gap: 20px; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .avatar { width: 30px; height: 30px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: var(--text-gray); }
        .content { line-height: 1.7; font-size: 15px; }

        /* Image Support */
        .gen-image { max-width: 100%; border-radius: 4px; margin-top: 15px; border: 1px solid #222; filter: grayscale(20%); }

        /* Floating Input */
        .input-area { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; }
        .input-pill { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 4px; display: flex; align-items: center; padding: 5px 20px; width: 70%; max-width: 800px; }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 15px; font-size: 14px; letter-spacing: 0.5px; }
        .action-btn { color: #333; cursor: pointer; padding: 10px; transition: 0.3s; font-size: 12px; }
        .action-btn:hover { color: var(--magic-purple); }

        /* Modals (Help/Settings) */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #0a0a0a; border: 1px solid #222; padding: 40px; border-radius: 8px; width: 400px; text-align: center; }
    </style>
</head>
<body>

    <div class="lightning-overlay"></div>

    <div class="sidebar">
        <div class="nav-item" onclick="location.reload()" style="border: 1px solid #222; color: white;">INITIALIZE NEW</div>
        
        <div class="section-label">My Stuff</div>
        <div class="nav-item">ARCHIVE</div>
        <div class="nav-item">VISUALIZATIONS</div>
        
        <div class="section-label">Recent Queries</div>
        <div id="history">
            <div class="nav-item">Frontend vs Backend AI</div>
        </div>

        <div style="margin-top: auto;">
            <div class="nav-item" onclick="toggleModal('Help')">HELP</div>
            <div class="nav-item" onclick="toggleModal('Settings')">SETTINGS</div>
            <div class="nav-item" style="color: #333; cursor: default;">ID: OBSIDIAN_USER</div>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div class="model-name">BELLA // SYSTEM 2.0</div>
            <div class="avatar">U</div>
        </div>

        <div id="chat">
            <div id="welcome" style="margin-top: 10vh;">
                <h1 style="font-size: 40px; font-weight: 200; color: #fff;">Awaiting command...</h1>
                <p style="color: var(--text-gray); margin-top: 10px;">The interface is ready for neural input.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-pill">
                <label for="img-input" class="action-btn">UPLOAD</label>
                <input type="file" id="img-input" hidden accept="image/*">
                <input type="text" id="userInput" placeholder="Whisper a prompt..." onkeypress="if(event.key==='Enter') askBella()">
                <div class="action-btn" onclick="askBella()">CONJURE</div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" onclick="toggleModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 id="modal-title" style="margin-bottom: 10px;"></h2>
            <p id="modal-body" style="color: var(--text-gray);"></p>
            <button onclick="toggleModal()" style="margin-top: 20px; background: transparent; border: 1px solid #333; color: white; padding: 10px 20px; cursor: pointer;">CLOSE</button>
        </div>
    </div>

    <script>
        function toggleModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            if (type) {
                title.innerText = type;
                body.innerText = type === 'Settings' ? "Adjusting system frequencies and obsidian depth..." : "Documentation for the neural interface.";
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        async function askBella() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const msg = input.value;
            if (!msg) return;

            if (document.getElementById('welcome')) document.getElementById('welcome').remove();

            chat.innerHTML += `<div class="msg-row"><div class="avatar">U</div><div class="content">${msg}</div></div>`;
            
            const thinkId = "think-" + Date.now();
            chat.innerHTML += `<div class="msg-row" id="${thinkId}"><div class="avatar">B</div><div class="content" style="color:#7c3aed">✦ Processing...</div></div>`;
            
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                // Determine if this is an image request
                const isImg = msg.toLowerCase().includes("generate") || msg.toLowerCase().includes("image");

                const res = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, type: isImg ? 'image' : 'text' })
                });
                const data = await res.json();
                
                document.getElementById(thinkId).remove();

                let htmlContent = data.reply;
                if (data.imageUrl) {
                    htmlContent += `<br><img src="${data.imageUrl}" class="gen-image">`;
                }

                chat.innerHTML += `<div class="msg-row"><div class="avatar">B</div><div class="content">${htmlContent}</div></div>`;
            } catch {
                document.getElementById(thinkId).innerHTML = "System link lost.";
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
