<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Bella AI</title>
    <style>
        :root {
            --bg: #0e0e0e;
            --sidebar: #131314;
            --hover: #1e1f20;
            --text-main: #e3e3e3;
            --text-gray: #c4c7c5;
            --accent: #4285f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar & Search --- */
        .sidebar { 
            width: 280px; background: var(--sidebar); display: flex; flex-direction: column; 
            padding: 16px; transition: transform 0.3s ease; z-index: 1000;
        }
        .search-bar {
            width: 100%; background: #202123; border: 1px solid #333;
            border-radius: 12px; padding: 10px 15px; color: white; outline: none; font-size: 14px; margin: 15px 0;
        }
        .nav-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; 
            border-radius: 25px; cursor: pointer; font-size: 14px; color: var(--text-gray);
        }
        .nav-item:hover { background: var(--hover); color: white; }

        /* --- Header --- */
        .header { 
            padding: 15px 25px; display: flex; align-items: center; 
            justify-content: center; position: relative; background: var(--bg); 
        }
        .menu-toggle { font-size: 24px; cursor: pointer; position: absolute; left: 20px; }
        .logo-container { font-size: 22px; font-weight: 600; letter-spacing: 2px; color: #fff; }

        /* --- Main Layout --- */
        .main { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        #chat { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 30px; padding-bottom: 150px; }

        /* --- Input Bar --- */
        .input-container { padding: 20px 15%; width: 100%; position: absolute; bottom: 0; background: linear-gradient(transparent, var(--bg) 60%); }
        .pill { background: #1e1f20; border-radius: 32px; display: flex; align-items: center; padding: 8px 16px; gap: 10px; border: 1px solid #333; }
        input[type="text"] { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 12px; font-size: 16px; }
        .tool-btn { font-size: 26px; color: var(--text-gray); cursor: pointer; }
        .send-arrow { color: var(--accent); font-size: 26px; cursor: pointer; }

        @media (max-width: 800px) {
            .sidebar { position: fixed; left: -280px; height: 100%; }
            .sidebar.open { left: 0; }
            #chat { padding: 20px 5% 150px 5%; }
            .input-container { padding: 10px; bottom: 10px; }
            h1, h2 { font-size: 34px !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="nav-item" onclick="createNewChat()" style="background: #28292a; color: white; justify-content: center;">
            <span>+</span> New Chat
        </div>
        <input type="text" class="search-bar" placeholder="Search chats...">
        <div style="font-size: 11px; color: #555; margin: 10px 15px; text-transform: uppercase;">History</div>
        <div id="history">
            <div class="nav-item" style="color: var(--accent); font-weight: bold; background: rgba(66,133,244,0.05);">Frontend vs Backend AI</div>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div class="menu-toggle" onclick="toggleMenu()">☰</div>
            <div class="logo-container">BELLA 2.5</div>
        </div>

        <div id="chat">
            <div style="margin-top: 15vh;" id="welcome">
                <h1 style="font-size: 56px; background: linear-gradient(to right, #4285f4, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Hello, User</h1>
                <h2 style="font-size: 56px; color: #444746;">How can I help?</h2>
            </div>
        </div>

        <div class="input-container">
            <div class="pill">
                <label for="file-up" class="tool-btn">+</label>
                <input type="file" id="file-up" hidden>
                <input type="text" id="userInput" placeholder="Ask Bella anything..." onkeypress="if(event.key==='Enter') askBella()">
                <div class="send-arrow" onclick="askBella()">➤</div>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

        function createNewChat() {
            const chat = document.getElementById('chat');
            const history = document.getElementById('history');
            
            // If there's a user message, add a snippet to history
            const messages = chat.querySelectorAll('.user-msg-text');
            if (messages.length > 0) {
                const snippet = messages[0].innerText.substring(0, 20) + "...";
                history.innerHTML = `<div class="nav-item">${snippet}</div>` + history.innerHTML;
            }

            // Reset Chat View
            chat.innerHTML = `
                <div style="margin-top: 15vh;" id="welcome">
                    <h1 style="font-size: 56px; background: linear-gradient(to right, #4285f4, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Hello, User</h1>
                    <h2 style="font-size: 56px; color: #444746;">How can I help?</h2>
                </div>`;
        }

        async function askBella() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const msg = input.value;
            if (!msg) return;

            if (document.getElementById('welcome')) document.getElementById('welcome').remove();

            chat.innerHTML += `<div class="msg-row"><div><b>You</b><br><span class="user-msg-text">${msg}</span></div></div>`;
            const tId = "t-" + Date.now();
            chat.innerHTML += `<div class="msg-row" id="${tId}"><div style="color:#a855f7; font-size:20px;">✦</div><div style="margin-left:10px;">Thinking...</div></div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                document.getElementById(tId).remove();
                chat.innerHTML += `<div class="msg-row"><div style="color:#a855f7; font-size:20px;">✦</div><div style="margin-left:10px;">${data.reply}</div></div>`;
            } catch { document.getElementById(tId).innerHTML = "System offline."; }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
